name: BituahApp
options:
  bundleIdPrefix: com.dima
  deploymentTarget:
    iOS: "17.0"
packages:
  BituahCore:
    path: ..
  SwiftyTesseract:
    path: Vendor/SwiftyTesseract
targets:
  BituahApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../Samples
        type: folder
        buildPhase: resources
        excludes: ["variants/visual_*"]
      - path: tessdata
        type: folder
        buildPhase: resources
    dependencies:
      - package: BituahCore
        product: BituahCore
      - package: SwiftyTesseract
        product: SwiftyTesseract
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: המצלמה משמשת לצילום הפוליסה. העיבוד מתבצע על המכשיר בלבד.
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDisplayName: ביטוח
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.dima.bituah
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LJPXXSNQZ9
        TARGETED_DEVICE_FAMILY: "1"
